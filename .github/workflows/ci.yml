name: ci

# lint + typecheck on every push/pr (vercel builds);
# weekly run re-checks shipped dependencies fr new advisories & emails on failure
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
